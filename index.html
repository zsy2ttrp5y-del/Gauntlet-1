<style>

<script>
const $=i=>document.getElementById(i),cv=$('c'),x=cv.getContext('2d'),W=800,H=450,G=360,GR=1800,RUN=260,JV=620,TOTAL=3200;
// ---------- save ----------
let S={un:1,best:{},coins:0,own:[],ch:'block',sk:0,hat:'none',tr:'none',ver:2};
try{const d=JSON.parse(localStorage.getItem('g1000'));if(d&&d.ver==2)S=Object.assign(S,d)}catch(e){}
delete S.edit;delete S.mine;
const save=()=>{try{localStorage.setItem('g1000',JSON.stringify(S))}catch(e){}};
// ---------- catalogs ----------
const CH=[{id:'block',n:'Block',c:0},{id:'dog',n:'Dog',c:250},{id:'cat',n:'Cat',c:250},{id:'bunny',n:'Bunny',c:300}];
const HN=['Ruby','Amber','Gold','Lime','Jade','Teal','Sky','Azure','Violet','Orchid','Rose','Slate'],HU=[350,30,48,90,150,175,200,215,265,295,330,220];
const SH=[['Pale',70,82],['Soft',60,68],['Bright',85,58],['Vivid',100,50],['Neon',100,62],['Deep',75,38],['Dark',55,26],['Ash',18,55]];
const SK=[];HN.forEach((a,hi)=>SH.forEach((b,si)=>SK.push({n:a+' '+b[0],h:HU[hi],s:b[1],l:b[2],c:SK.length?20+si*12+hi*4:0})));
SK.push({n:'Rainbow (animated)',h:0,s:80,l:60,c:600,rb:1});
const HT=[['none','No hat',0],['cap','Red cap',80],['headband','Headband',90],['flower','Flower',100],['antenna','Antenna',110],['party','Party hat',120],['horns','Devil horns',180],['top','Top hat',200],['cowboy','Cowboy hat',200],['wizard','Wizard hat',220],['halo','Halo',250],['crown','Crown',300],['beanie','Beanie',90],['bow','Pink bow',100],['sprout','Sprout',110],['cone','Traffic cone',120],['chef','Chef hat',140],['pirate','Pirate hat',160],['santa','Santa hat',170],['propeller','Propeller cap',190],['viking','Viking helm',210],['tiara','Tiara',260]].map(a=>({id:a[0],n:a[1],c:a[2]}));
const TR=[['none','No trail',0,'#fff'],['spark','Sparks',100,'#ffd23f'],['frost','Frost',100,'#9be7ff'],['ember','Ember',130,'#ff7a1a'],['slime','Slime',130,'#7cff4f'],['violet','Violet',160,'#b070ff'],['pink','Candy',160,'#ff7ac8'],['smoke','Smoke',180,'#aab'],['rb','Rainbow',350,'#fff'],['mint','Mint',120,'#7dffc9'],['gold','Gold dust',140,'#ffd700'],['ocean','Ocean',150,'#2f8fff'],['blood','Crimson',150,'#e0243a'],['neon','Neon',170,'#39ff14'],['shadow','Shadow',170,'#555'],['lava','Lava',250,'#fff',[10,20]],['sunset','Sunset',220,'#fff',[20,30]],['galaxy','Galaxy',300,'#fff',[260,40]],['aurora','Aurora',320,'#fff',[150,60]]].map(a=>({id:a[0],n:a[1],c:a[2],col:a[3],cyc:a[4]}));
const own=id=>S.own.includes(id);
// ---------- levels ----------
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const OB=(()=>{const sn=Math.sin,cs=Math.cos,PI=Math.PI,G=360,tw=u=>Math.abs((((u/PI)%2)+2)%2-1),sv=u=>(((u/(2*PI))%1)+1)%1,C=(x,y,r)=>({c:1,x,y,r}),R=(x,y,w,h,k)=>({x,y,w,h,k:k||'d'}),pd=(x,u)=>{const t=sn(u)*.95;return C(x+sn(t)*170,G-215+cs(t)*170,15)};
return [
['Pendulum',(o,u)=>[pd(o.x,u)]],
['Orbit mines',(o,u)=>[0,1,2].map(i=>C(o.x+cs(u+i*2.09)*60,G-90+sn(u+i*2.09)*60,11))],
['Bouncing ball',(o,u)=>[C(o.x,G-16-Math.abs(sn(u))*130,16)]],
['Ceiling piston',(o,u)=>[R(o.x-20,-60,40,G-30+(.5+.5*sn(u))*80-0)]],
['Beam laser',(o,u)=>sn(u)>.2?[R(o.x-90,G-28,180,6)]:[]],
['Pillar laser',(o,u)=>sn(u)>.2?[R(o.x-4,G-230,8,230)]:[]],
['Dropper',(o,u)=>{const f=sv(u*.5);return [R(o.x-12,f<.3?-40+f/.3*(G-10):-60,24,28)]}],
['Boulder',(o,u)=>[C(o.x+90-((u*40)%180+180)%180,G-22,22)]],
['Sweeper wall',(o,u)=>[R(o.x-12+sn(u)*90,G-70,24,70)]],
['Zigzag saw',(o,u)=>[C(o.x+(tw(u)*2-1)*80,G-30-tw(u*2.3)*90,13)]],
['Spike wave',(o,u)=>[0,1,2,3].map(i=>{const h=Math.max(0,sn(u-i*.9))*34;return h>4?R(o.x-100+i*55,G-h,24,h):0}).filter(Boolean)],
['Fireball arc',(o,u)=>{const f=sv(u*.4);return [C(o.x-120+f*240,G-20-sn(f*PI)*150,12)]}],
['Hammer',(o,u)=>[25,50,75].map(r=>C(o.x+cs(u)*r,G-85+sn(u)*r,10))],
['Windmill',(o,u)=>[0,1,2,3].flatMap(i=>[30,55].map(r=>C(o.x+cs(u*.8+i*1.57)*r,G-80+sn(u*.8+i*1.57)*r,9)))],
['Figure eight',(o,u)=>[C(o.x+sn(u)*110,G-60+sn(2*u)*40,13)]],
['Swarm',(o,u)=>[0,1,2].map(i=>C(o.x+sn(u+i*2.1)*80,G-50+cs(u*1.3+i*2.1)*45,10))],
['Pulse ring',(o,u)=>[C(o.x,G-6,18+Math.abs(sn(u))*36)]],
['Comb teeth',(o,u)=>[0,1,2,3].map(i=>{const h=24*(.5+.5*sn(u+i*PI));return h>6?R(o.x-110+i*70,G-h,26,h):0}).filter(Boolean)],
['Jumping spike',(o,u)=>[R(o.x-10,G-24-Math.abs(sn(u))*100,20,24)]],
['Crusher',(o,u)=>{const g=130*(.5+.5*sn(u));return [R(o.x-g/2-34,G-70,34,70),R(o.x+g/2,G-70,34,70)]}],
['Lava pool',(o,u)=>{const h=40*(.5+.5*sn(u));return [R(o.x-80,G-h,160,h)]}],
['Meteor',(o,u)=>{const f=sv(u*.35);return [C(o.x-200+f*300,-20+f*(G+20),16)]}],
['Pogo ball',(o,u)=>[C(o.x+sn(u*.5)*90,G-16-Math.abs(sn(u*2))*100,15)]],
['Spiral',(o,u)=>{const m=Math.abs(sn(u*.4));return [C(o.x+cs(u*2)*70*m,G-60+sn(u*2)*50*m,12)]}],
['Double pendulum',(o,u)=>{const a=sn(u)*.9,px=o.x+sn(a)*90,py=G-220+cs(a)*90,b=a+sn(u*1.7)*.8;return [C(px,py,10),C(px+sn(b)*90,py+cs(b)*90,13)]}],
['Slam',(o,u)=>{const f=sv(u*.5),b=f<.2?(f/.2)**2*(G+10):f<.35?G+10:(1-(f-.35)/.65)*(G+10);return [R(o.x-20,-60,40,b+60)]}],
['Blink strip',(o,u)=>sn(u)>0?[R(o.x-60,G-14,120,14)]:[]],
['Seesaw spikes',(o,u)=>{const h=30*(.5+.5*sn(u));return [R(o.x-70,G-h,40,h),R(o.x+30,G-(30-h),40,30-h)]}],
['Hail rain',(o,u)=>[0,1,2,3,4].map(i=>C(o.x-100+i*50,-20+sv(u*.5+i*.37)*(G+20),8))],
['Twin boulders',(o,u)=>[C(o.x+90-((u*40)%180+180)%180,G-20,20),C(o.x-90+((u*34+90)%180+180)%180,G-20,20)]],
['Bat',(o,u)=>[C(o.x+sn(u)*100,G-130+sn(u*3)*40,11)]],
['Rising pillar',(o,u)=>{const h=70*(.5+.5*sn(u));return [R(o.x-14,G-h,28,h)]}],
['Fireball trio',(o,u)=>[0,1,2].map(i=>{const f=sv(u*.4+i/3);return C(o.x-120+f*240,G-20-sn(f*PI)*150,10)})],
['Ground rocket',(o,u)=>[C(o.x+150-sv(u*.7)*300,G-22,12)]],
['Scissors',(o,u)=>[30,55].flatMap(r=>[C(o.x+cs(u)*r,G-60+sn(u)*r,9),C(o.x-cs(u)*r,G-60-sn(u)*r,9)])],
['Shockwave',(o,u)=>{const f=sv(u*.5);return [C(o.x-f*150,G-12,12),C(o.x+f*150,G-12,12)]}],
['Twin pistons',(o,u)=>[R(o.x-50,-60,30,G-30+(.5+.5*sn(u))*80),R(o.x+20,-60,30,G-30+(.5-.5*sn(u))*80)]],
['Moving trampoline',(o,u)=>[R(o.x-30+sn(u)*60,G-12,60,12,'b')]],
['Gust',(o,u)=>[R(o.x-100,G-120,200,120,sn(u)>0?'w1':'w-1')]],
['Headwind',(o)=>[R(o.x-100,G-120,200,120,'w-1')]],
['Strobe spikes',(o,u)=>sn(u*2)>0?[R(o.x-40,G-20,80,20)]:[]],
['Orbit pair',(o,u)=>[C(o.x+cs(u*2)*45,G-45+sn(u*2)*30,10),C(o.x-cs(u*2)*45,G-45-sn(u*2)*30,10)]],
['Hopper blob',(o,u)=>[C(o.x-100+sv(u*.4)*200,G-18-Math.abs(sn(u*4))*28,16)]],
['Dipper',(o,u)=>[C(o.x+(tw(u*.5)-.5)*220,G-24-Math.abs(sn(u*3))*40,13)]],
['Rising wall',(o,u)=>{const h=sv(u*.4)*80;return h>3?[R(o.x-30,G-h,60,h)]:[]}],
['Spinner cross',(o,u)=>[0,1,2,3].map(i=>C(o.x+cs(u+i*1.57)*48,G-80+sn(u+i*1.57)*48,10))],
['Pendulum pair',(o,u)=>[pd(o.x-60,u),pd(o.x+60,u+PI)]],
['Zip line',(o,u)=>[C(o.x-130+tw(u*.8)*260,G-90,12)]],
['Guardians',(o,u)=>[0,1].map(i=>C(o.x-50+i*100,G-16-Math.abs(sn(u+i*1.6))*120,14))],
['Spike conveyor',(o,u)=>[0,1,2,3].map(i=>R(o.x-120+((i*60+u*30)%240+240)%240,G-18,18,18))],
['Gear ring',(o,u)=>[0,1,2,3,4,5].map(i=>C(o.x+cs(u+i*1.047)*40,G-70+sn(u+i*1.047)*40,8))]
]})();
function build(n,seed,chAdd){
 const r=rng((seed==null?n*7919+13:seed)),L={sol:[],spk:[],saw:[],mov:[],pad:[],kill:[],hue:(n*17)%360,ob:[]},d=Math.min(n,110);
 const ty=['gap','spk'];if(n>=3)ty.push('wall');if(n>=6)ty.push('saw');if(n>=10)ty.push('mov');if(n>=15)ty.push('pad');if(n>=25)ty.push('saw2');if(n>=35)ty.push('gate');if(n>=45)ty.push('beam');if(n>=55)ty.push('spring');if(n>=12)ty.push('ob');if(n>=60)ty.push('ob');if(n>=150)ty.push('ob');const km=seed!=null?OB.length:Math.min(OB.length,4+Math.floor(n/8));
 const gm=Math.min(55+d*1.3,145),sf=Math.max(220-d*1.7,96),sp=Math.min(44+d*1.1,130),ch=Math.min(7+Math.round(n*.14),52)+(chAdd||0);
 const ss=Math.min(1.9+d*.05,5),ms=Math.min(1.25+d*.03,3.3);let px=400;
 const gr=(a,w)=>L.sol.push({x:a,y:G,w,h:200});gr(-200,600);
 if(seed==null&&n%25==5){L.fly=1;const gh=Math.max(118,190-Math.min(n,260)*.32),cnt=Math.min(9+Math.floor(n/34),32);let gy=190,fx=620;
  for(let i=0;i<cnt;i++){gy=Math.max(70,Math.min(255,gy+(r()-.5)*260));
   L.kill.push({x:fx,y:-60,w:40,h:gy+60},{x:fx,y:gy+gh,w:40,h:H+300-gy-gh});fx+=200}
  gr(fx+60,360);L.flag=fx+260;return L}
 for(let i=0;i<ch;i++){const t=ty[Math.floor(r()*ty.length)],sw=sp*(.7+.3*r());
  if(t=='gap'){gr(px,sf);px+=sf+gm*(.7+.3*r())}
  else if(t=='spk'){gr(px,sf+sw);L.spk.push({x:px+sf/2,y:G-20,w:sw,h:20});px+=sf+sw}
  else if(t=='wall'){const wh=45+r()*35;gr(px,sf+30);L.sol.push({x:px+sf/2,y:G-wh,w:30,h:wh});px+=sf+30}
  else if(t=='saw'){gr(px,sf+80);L.saw.push({cx:px+sf/2+40,sp:ss,ph:r()*6.28,cy:342,rot:0});px+=sf+80}
  else if(t=='saw2'){gr(px,sf+210);for(let k=0;k<2;k++)L.saw.push({cx:px+sf/2+40+k*130,sp:ss,ph:r()*6.28,cy:342,rot:0});px+=sf+210}
  else if(t=='mov'){gr(px,sf);px+=sf;L.mov.push({x0:px,x:px,sp:ms,ph:r()*6.28,dx:0});px+=230}

async function importCode(code,mode){try{const r=await decLevel(code);if(mode=='play'){playLevel(r.name,r.data);return ''}return addFile(r)}catch(e){return 'That code does not look right.'}}
async function copyText(t){try{await navigator.clipboard.writeText(t);return 1}catch(e){const a=$('shc');if(!a)return 0;a.value=t;a.select();try{return document.execCommand('copy')}catch(_){return 0}}}
async function shareFile(q){const code=await encLevel(q.name,q.data),link=location.href.split('#')[0]+'#level='+code;
 $('pop').innerHTML=`<h1>Share "${esc(q.name)}"</h1><div>Send this code or link to a friend. They can paste it under "Play a friend's level".</div><textarea id="shc" readonly style="width:90%;max-width:420px;height:90px;font:12px monospace"></textarea><div class="row"><button class="p" id="shcc">Copy code</button><button id="shcl">Copy link</button><button id="shx">Close</button></div><div id="shm" style="font-size:12px;min-height:14px"></div>`;
 $('shc').value=code;$('pop').classList.add('on');
 $('shcc').onclick=async()=>{$('shm').textContent=(await copyText(code))?'Code copied!':'Select the text above and copy it.'};
 $('shcl').onclick=async()=>{$('shm').textContent=(await copyText(link))?'Link copied!':'Select the text above and copy it.'};
 $('shx').onclick=()=>$('pop').classList.remove('on')}
if(/^#level=/.test(location.hash)){(async()=>{try{const r=await decLevel(location.hash.slice(7)),clr=()=>{$('pop').classList.remove('on');try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}};
 $('pop').innerHTML=`<h1>A friend shared a level</h1><div><b>${r.name}</b></div><div class="row"><button class="p" id="shp">Play it</button><button id="shsv">Save to My files</button><button id="shno">Not now</button></div><div id="shm2" style="font-size:12px;min-height:14px"></div>`;$('pop').classList.add('on');
 $('shp').onclick=()=>{clr();playLevel(r.name,r.data)};$('shsv').onclick=()=>{$('shm2').textContent=addFile(r)};$('shno').onclick=clr}catch(e){}})()}
renderMenu();requestAnimationFrame(loop);
</script></body></html>
