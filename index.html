/* Startup watchdog: if the game fails to start (white screen), show why, and restart it after 10 seconds without mouse movement. Saved progress is not touched. */
(function(){var errs=[],last=Date.now(),t0=0,box=null,shownAt=0;
function mv(){last=Date.now()}
['mousemove','touchstart','pointerdown','keydown'].forEach(function(e){addEventListener(e,mv,{passive:true})});
addEventListener('error',function(e){errs.push((e.message||'error')+(e.lineno?' (line '+e.lineno+')':''))});
function cnt(){try{var m=String(window.name).match(/gntrl(\d+)/);return m?+m[1]:0}catch(x){return 0}}

setInterval(function(){
 if(window.__gntBoot){if(box){box.remove();box=null}if(cnt())setc(0);return}
 if(document.readyState==='loading')return;
 if(!t0)t0=Date.now();
 var el=Date.now()-t0;if(el<3000)return;
 var c=cnt(),idle=Date.now()-Math.max(last,t0),left=Math.max(0,Math.ceil((10000-idle)/1000)),b=mk();
 var er=errs.length?'<div style="font-size:12px;opacity:.7;max-width:520px;word-break:break-word">Error: '+errs[0].replace(/</g,'&lt;')+'</div>':'';
 if(c>=3){b.innerHTML='<h2 style="margin:0">The game will not start</h2><div>Your saved progress is safe. Try again, or ask for help on our Discord.</div>'+er+'<div><button id="gntr" style="font-size:16px;padding:8px 16px">Try again</button> <a href="https://discord.gg/YGknYDHRC" target="_blank" rel="noopener noreferrer" style="font-size:16px;padding:8px 16px">Join our Discord</a></div>';var r=document.getElementById('gntr');if(r)r.onclick=function(){setc(0);location.reload()};return}
 b.innerHTML='<h2 style="margin:0">Gauntlet is having trouble starting</h2><div>Restarting in '+left+'s. Move your mouse to wait a little longer. Your progress is saved.</div>'+er;

},500)})();
