// ---------- Dumpling's level coach (warns while you build) ----------
const COACH=(()=>{
 let tm=0,shown={},cur=null,lastEd=null;const MAXGAP=195,MAXRISE=100,JUMPGAP=140,STEP=70;
 const on=()=>S.coach!==0;
 const who=()=>S.helper=='c'?{n:'Coco',svg:COCO_SVG,id:'c',col:'#c2527a'}:{n:'Dumpling',svg:DMP_SVG,id:'d',col:'#d63031'};
 const bridged=(d,x0,x1)=>{const iv=[];(d.pad||[]).forEach(q=>iv.push([q.x-20,q.x+q.w+20]));(d.mov||[]).forEach(m=>{const a=m.x0!=null?m.x0:m.x;iv.push([a-20,a+(m.rg!=null?m.rg:140)+110])});iv.sort((a,b)=>a[0]-b[0]);let cur=x0;for(const v of iv){if(v[1]<=cur)continue;if(v[0]-cur>MAXGAP)break;cur=Math.max(cur,v[1]);if(x1-cur<=MAXGAP)return true}return x1-cur<=MAXGAP};
 function find(d){const out=[];if(!d||d.fly)return out;
  const sol=(d.sol||[]).filter(q=>q.w>0).slice().sort((a,b)=>a.x-b.x);
  if(!sol.some(q=>q.x<=86&&q.x+q.w>=60&&q.y>=300&&q.y<=400))out.push({k:'start',t:'start',x:0,m:'There is no floor where the player starts. Add some ground at the very beginning.',fx:'I will add a piece of ground under the start.'});
  let a=null;
  for(const b of sol){if(a){const right=a.x+a.w,gap=b.x-right;
    if(gap>MAXGAP&&!bridged(d,right,b.x))out.push({k:'gap'+Math.round(right/10),t:'gap',x:right,r:right,b:b.x,ya:a.y,yb:b.y,m:'This gap is too wide to jump across. Try making it smaller, or add a platform in the middle.',fx:'I will add small stepping platforms across the gap so it can be jumped.'});
    else if(gap<=40&&a.y-b.y>MAXRISE)out.push({k:'rise'+Math.round(b.x/10),t:'rise',x:b.x-40,r:right,b:b.x,ya:a.y,yb:b.y,m:'This step is too tall to jump up. Try making it lower, or add a smaller step first.',fx:'I will add a smaller step in front of it so it can be climbed.'})}
   if(!a||b.x+b.w>a.x+a.w)a=b}
  if(a&&a.x+a.w<d.flag-40&&!bridged(d,a.x+a.w,d.flag))out.push({k:'end',t:'end',x:a.x+a.w,r:a.x+a.w,m:'There is no floor near the finish flag, so players could not reach it. Add ground up to the flag.',fx:'I will add ground all the way up to the flag.'});
  return out}
 // repair one problem by ADDING things (nothing the player built is removed)
 function repair(d,w){const sn=v=>Math.round(v/10)*10;
  if(w.t=='start'){d.sol.push({x:-200,y:G,w:600,h:200});return 1}
  if(w.t=='end'){const x0=Math.max(w.r-20,0);d.sol.push({x:x0,y:G,w:Math.max(200,d.flag+300-x0),h:200});return 1}
  if(w.t=='gap'){const n=Math.max(1,Math.ceil((w.b-w.r)/(JUMPGAP+60))-0),span=w.b-w.r,cnt=Math.ceil(span/150)-1;
   for(let i=1;i<=cnt;i++){const cx=w.r+span*i/(cnt+1),y=Math.round((w.ya+(w.yb-w.ya)*i/(cnt+1))/10)*10;d.sol.push({x:sn(cx-45),y:Math.min(y,G),w:90,h:16})}return 1}
  if(w.t=='rise'){const dy=w.ya-w.yb,cnt=Math.ceil(dy/STEP)-1;
   for(let i=1;i<=cnt;i++){const y=sn(w.ya-dy*i/(cnt+1)),x=sn(w.b-100*(cnt+1-i)-20);d.sol.push({x,y,w:w.b-x+10*i,h:Math.max(16,G+200-y)})}return 1}
  return 0}
 function hide(){const e=$('coach');if(e)e.remove();cur=null}
 function speak(t){try{dSpeak(t,null,false,who().id)}catch(e){}}
 function show(w,mode){hide();cur=w;mode=mode||'msg';const h=who(),sm=window.innerHeight<420,d=document.createElement('div');d.id='coach';
  d.style.cssText='position:fixed;left:50%;top:8px;transform:translateX(-50%);z-index:70;width:min(560px,94vw);background:#d63031;color:#fff;border:4px solid #fff;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.5);padding:'+(sm?'6px 8px':'10px 12px')+';display:flex;gap:10px;align-items:center;text-align:left';
  const ask=mode=='ask',ttl=ask?h.n+' asks: can I take control of your level?':h.n+' wants to tell you something!',txt=ask?w.fx+' Your own pieces stay exactly as they are, and Undo brings your old version back.':w.m;
  const btns=ask?'<button class="p" id="cch3">Yes, fix it</button><button id="cch4">No thanks</button>':'<button id="cch0">See details</button><button id="cch1">Show me</button><button class="p" id="cch2">Got it</button>';
  d.innerHTML=`<div style="flex:none">${h.svg}</div><div style="flex:1"><div style="font-size:${sm?15:20}px;font-weight:900;line-height:1.1">${ttl}</div><div style="font-size:${sm?12:15}px;margin:4px 0 ${sm?4:8}px">${mode=='msg'?txt:txt}</div><div style="display:flex;gap:8px;flex-wrap:wrap">${btns}</div></div>`;
  document.body.appendChild(d);
  const go=()=>{try{cam=edClamp(Math.max(0,w.x-300));const e=$('es');if(e)e.value=edMax()?cam/edMax()*100:0}catch(e){}};
  if(ask){$('cch3').onclick=()=>{try{const before=clone(E);hp();if(repair(E,w)){ed.dirty=1;ed.sel=null;edSay(h.n+' fixed it. Undo brings your old version back.');speak('All fixed! Your level can be beaten now. Press undo if you want your old version back.');hide();shown={};cur=null;soon()}else{hide()}}catch(e){hide()}};
   $('cch4').onclick=()=>{speak('Okay, no problem. It is still your level.');hide()};
   speak(h.n=='Coco'?'Can I take control of your level? '+txt:'Can I take control of your level? '+txt)}
  else{$('cch0').onclick=()=>{go();show(w,'ask')};$('cch1').onclick=go;$('cch2').onclick=()=>{try{dStopSpeak()}catch(e){}hide()};
   speak(h.n+' wants to tell you something! '+txt)}}
 function check(){tm=0;if(!on()||state!='edit'||!ed||!E){hide();return}
  if(ed.drag){soon();return}
  if(ed!==lastEd){lastEd=ed;shown={};hide()}
  const L2=find(E),keys={};L2.forEach(w=>keys[w.k]=1);Object.keys(shown).forEach(k=>{if(!keys[k])delete shown[k]});
  if(cur&&keys[cur.k])return;hide();const w=L2.find(q=>!shown[q.k]);if(w){shown[w.k]=1;show(w)}}
 function soon(){clearTimeout(tm);tm=setTimeout(check,800)}
 setInterval(()=>{if(state!='edit'&&$('coach'))hide()},800);
 return{find,soon,hide,check,on,repair,show}
})();

 m.innerHTML=`<div style="background:#fff;color:#111;border:4px solid #d63031;border-radius:16px;padding:16px;max-width:380px;text-align:center"><div style="font-size:20px;font-weight:900;color:#d63031">Turning this off is not recommended</div><div style="margin:8px 0 12px;font-size:14px">Dumpling warns you when a level cannot be beaten, like a gap that is too wide to jump. Without it you might build or share a level nobody can finish.</div><div class="row"><button class="p" id="cok">Keep it on</button><button id="cof">Turn off anyway</button></div></div>`;
 document.body.appendChild(m);$('cok').onclick=()=>m.remove();$('cof').onclick=()=>{m.remove();done()}}
