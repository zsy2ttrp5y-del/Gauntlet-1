<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Gauntlet 3200</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#eef1fb;--fg:#14182e;--card:#fff;--bd:#c9d0ee;--ac:#ffb703;--ov:rgba(238,241,251,.94);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1230;--fg:#eef1ff;--card:#1a2050;--bd:#2c3578;--ov:rgba(14,18,48,.94)}}
:root[data-theme="dark"]{--bg:#0e1230;--fg:#eef1ff;--card:#1a2050;--bd:#2c3578;--ov:rgba(14,18,48,.94)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center}
#stage{position:relative;width:100%;max-width:960px;aspect-ratio:16/9;margin-top:8px;border-radius:12px;overflow:hidden;background:#111;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{width:100%;height:100%;display:block}
.ov{position:absolute;inset:0;background:var(--ov);display:none;flex-direction:column;align-items:center;padding:10px;gap:8px;overflow:auto;text-align:center}
.ov.on{display:flex}
h1{margin:2px 0;color:var(--ac);font-size:clamp(22px,5vw,38px)}
button{font:inherit;font-weight:700;border:2px solid var(--bd);background:var(--card);color:var(--fg);border-radius:10px;padding:6px 12px;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
button.p{background:var(--ac);color:#14182e;border-color:var(--ac)}
#grid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;width:100%;max-width:560px}
#grid button{padding:5px 0;font-size:13px}#grid button.d{background:#1c6b58;color:#fff}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
#list{width:100%;max-width:520px;display:flex;flex-direction:column;gap:5px}
.it{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:5px 10px;text-align:left}
.it b{flex:1}.sw{width:22px;height:22px;border-radius:50%;border:2px solid var(--bd)}
input{font:inherit;padding:6px 10px;border-radius:10px;border:2px solid var(--bd);background:var(--card);color:var(--fg);width:150px;text-align:center}
#ab{position:absolute;top:8px;right:8px;z-index:4;padding:2px 9px;opacity:.6}
#adm{z-index:6;justify-content:center}
#back{position:absolute;top:8px;left:8px;display:none;z-index:3;padding:4px 10px}
#pad{position:absolute;left:0;right:0;bottom:8px;display:none;justify-content:space-between;padding:0 12px;z-index:3;pointer-events:none}
#pad div{display:flex;gap:10px}
#pad button{pointer-events:auto;width:96px;height:66px;font-size:18px;font-weight:bold;opacity:.85;touch-action:none;user-select:none;-webkit-user-select:none}
#pad.on{display:flex}
#edt{position:fixed;inset:0;z-index:20;background:var(--bg,#111);color:var(--fg,#fff);display:none;flex-direction:column;align-items:center;gap:6px;padding:6px;padding-top:calc(6px + env(safe-area-inset-top,0px));padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));overflow:auto;text-align:center}
#edt.on{display:flex}
#edt .eb{width:100%;max-width:960px;display:flex;justify-content:space-between;align-items:center;gap:6px}
#edt .eb input{flex:1;min-width:0;text-align:center}
#edt .row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
#edt button{padding:8px 12px;font-size:14px}
#edt canvas{width:100%;max-width:min(960px,calc(46vh*1.7778));aspect-ratio:16/9;background:#111;border-radius:10px;touch-action:none;flex:none}
#edt #es{width:100%;max-width:min(960px,calc(46vh*1.7778))}
#eprops{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center;font-size:13px}
#est{font-size:13px;min-height:16px}
#tbx{display:none;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:6px;width:100%;max-width:960px}
#tbx.on{display:grid}
#tbx button{display:flex;flex-direction:column;align-items:center;gap:2px}
#tbx small{font-size:11px;opacity:.8}
.mdl{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--card,#222);border:2px solid var(--bd,#555);border-radius:12px;padding:14px;z-index:30;display:flex;flex-direction:column;gap:8px}
</style></head><body>
<div id="stage">
<canvas id="c" width="800" height="450"></canvas>
<button id="ab" title="Admin">&#9881;</button>
<button id="back">&larr; Menu</button>
<div id="pad"><div><button id="bl">&#9664; Back</button><button id="br">Forward &#9654;</button></div><button id="bj">Jump</button></div>
<div id="menu" class="ov on"></div>
<div id="shop" class="ov"></div>
<div id="won" class="ov" style="justify-content:center"></div>
<div id="adm" class="ov"></div>
</div>
<div id="edt"></div><div id="mkr" class="ov"></div><div id="pop" class="ov"></div>
<script>
const $=i=>document.getElementById(i),cv=$('c'),x=cv.getContext('2d'),W=800,H=450,G=360,GR=1800,RUN=260,JV=620,TOTAL=3200;
// ---------- save ----------
let S={un:1,best:{},coins:0,own:[],ch:'block',sk:0,hat:'none',tr:'none',ver:2};
try{const d=JSON.parse(localStorage.getItem('g1000'));if(d&&d.ver==2)S=Object.assign(S,d)}catch(e){}
delete S.edit;delete S.mine;
const save=()=>{try{localStorage.setItem('g1000',JSON.stringify(S))}catch(e){}};
// ---------- catalogs ----------
const CH=[{id:'block',n:'Block',c:0},{id:'dog',n:'Dog',c:250},{id:'cat',n:'Cat',c:250},{id:'bunny',n:'Bunny',c:300}];
const HN=['Ruby','Amber','Gold','Lime','Jade','Teal','Sky','Azure','Violet','Orchid','Rose','Slate'],HU=[350,30,48,90,150,175,200,215,265,295,330,220];
const SH=[['Pale',70,82],['Soft',60,68],['Bright',85,58],['Vivid',100,50],['Neon',100,62],['Deep',75,38],['Dark',55,26],['Ash',18,55]];
const SK=[];HN.forEach((a,hi)=>SH.forEach((b,si)=>SK.push({n:a+' '+b[0],h:HU[hi],s:b[1],l:b[2],c:SK.length?20+si*12+hi*4:0})));
SK.push({n:'Rainbow (animated)',h:0,s:80,l:60,c:600,rb:1});
const HT=[['none','No hat',0],['cap','Red cap',80],['headband','Headband',90],['flower','Flower',100],['antenna','Antenna',110],['party','Party hat',120],['horns','Devil horns',180],['top','Top hat',200],['cowboy','Cowboy hat',200],['wizard','Wizard hat',220],['halo','Halo',250],['crown','Crown',300],['beanie','Beanie',90],['bow','Pink bow',100],['sprout','Sprout',110],['cone','Traffic cone',120],['chef','Chef hat',140],['pirate','Pirate hat',160],['santa','Santa hat',170],['propeller','Propeller cap',190],['viking','Viking helm',210],['tiara','Tiara',260]].map(a=>({id:a[0],n:a[1],c:a[2]}));
const TR=[['none','No trail',0,'#fff'],['spark','Sparks',100,'#ffd23f'],['frost','Frost',100,'#9be7ff'],['ember','Ember',130,'#ff7a1a'],['slime','Slime',130,'#7cff4f'],['violet','Violet',160,'#b070ff'],['pink','Candy',160,'#ff7ac8'],['smoke','Smoke',180,'#aab'],['rb','Rainbow',350,'#fff'],['mint','Mint',120,'#7dffc9'],['gold','Gold dust',140,'#ffd700'],['ocean','Ocean',150,'#2f8fff'],['blood','Crimson',150,'#e0243a'],['neon','Neon',170,'#39ff14'],['shadow','Shadow',170,'#555'],['lava','Lava',250,'#fff',[10,20]],['sunset','Sunset',220,'#fff',[20,30]],['galaxy','Galaxy',300,'#fff',[260,40]],['aurora','Aurora',320,'#fff',[150,60]]].map(a=>({id:a[0],n:a[1],c:a[2],col:a[3],cyc:a[4]}));
const own=id=>S.own.includes(id);
// ---------- levels ----------
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function build(n){
 const r=rng(n*7919+13),L={sol:[],spk:[],saw:[],mov:[],pad:[],kill:[],hue:(n*17)%360},d=Math.min(n,80);
 const ty=['gap','spk'];if(n>=3)ty.push('wall');if(n>=6)ty.push('saw');if(n>=10)ty.push('mov');if(n>=15)ty.push('pad');if(n>=25)ty.push('saw2');
 const gm=Math.min(60+d*1.2,130),sf=Math.max(220-d*1.5,110),sp=Math.min(40+d,100),ch=Math.min(6+Math.round(n*.1),36);
 const ss=Math.min(1.8+d*.04,4.2),ms=Math.min(1.2+d*.025,2.8);let px=400;
 const gr=(a,w)=>L.sol.push({x:a,y:G,w,h:200});gr(-200,600);
 if(n%25==5){L.fly=1;const gh=Math.max(135,190-Math.min(n,200)*.3),cnt=Math.min(8+Math.floor(n/40),26);let gy=190,fx=620;
  for(let i=0;i<cnt;i++){gy=Math.max(70,Math.min(255,gy+(r()-.5)*240));
   L.kill.push({x:fx,y:-60,w:40,h:gy+60},{x:fx,y:gy+gh,w:40,h:H+300-gy-gh});fx+=210}
  gr(fx+60,360);L.flag=fx+260;return L}
 for(let i=0;i<ch;i++){const t=ty[Math.floor(r()*ty.length)],sw=sp*(.7+.3*r());
  if(t=='gap'){gr(px,sf);px+=sf+gm*(.7+.3*r())}
  else if(t=='spk'){gr(px,sf+sw);L.spk.push({x:px+sf/2,y:G-20,w:sw,h:20});px+=sf+sw}
  else if(t=='wall'){const wh=50+r()*45;gr(px,sf+30);L.sol.push({x:px+sf/2,y:G-wh,w:30,h:wh});px+=sf+30}
  else if(t=='saw'){gr(px,sf+80);L.saw.push({cx:px+sf/2+40,sp:ss,ph:r()*6.28,cy:342,rot:0});px+=sf+80}
  else if(t=='saw2'){gr(px,sf+210);for(let k=0;k<2;k++)L.saw.push({cx:px+sf/2+40+k*130,sp:ss,ph:r()*6.28,cy:342,rot:0});px+=sf+210}
  else if(t=='mov'){gr(px,sf);px+=sf;L.mov.push({x0:px,x:px,sp:ms,ph:r()*6.28,dx:0});px+=230}
  else{gr(px,sf+300);L.pad.push({x:px+80,y:G-12,w:40,h:12});L.spk.push({x:px+160,y:G-20,w:200,h:20});px+=sf+300}}
 gr(px,360);L.flag=px+200;return L}
// ---------- drawing the characters ----------
function tri(c,a,b,d,e,f,g,col){c.fillStyle=col;c.beginPath();c.moveTo(a,b);c.lineTo(d,e);c.lineTo(f,g);c.closePath();c.fill()}
function hat(c,id){c.save();c.translate(5,1);
 if(id=='cap'){c.fillStyle='#d62839';c.beginPath();c.arc(0,0,8,Math.PI,0);c.fill();c.fillRect(0,-2,13,3)}
 else if(id=='headband'){c.fillStyle='#ff4d6d';c.fillRect(-8.5,3,17,3)}
 else if(id=='flower'){c.fillStyle='#ff7ac8';c.beginPath();c.arc(-3,-2,4,0,7);c.fill();c.fillStyle='#ffd23f';c.beginPath();c.arc(-3,-2,1.8,0,7);c.fill()}
 else if(id=='antenna'){c.strokeStyle='#888';c.lineWidth=2;c.beginPath();c.moveTo(0,0);c.lineTo(0,-9);c.stroke();c.fillStyle='#f33';c.beginPath();c.arc(0,-10,3,0,7);c.fill()}
 else if(id=='party'){tri(c,-6,1,0,-15,6,1,'#ff7ac8');c.fillStyle='#ffd23f';c.beginPath();c.arc(0,-15,2,0,7);c.fill()}
 else if(id=='horns'){tri(c,-7,2,-6,-8,-2,0,'#d62839');tri(c,2,0,6,-8,7,2,'#d62839')}
 else if(id=='top'){c.fillStyle='#222';c.fillRect(-9,-1,18,3);c.fillRect(-6,-12,12,12);c.fillStyle='#d62839';c.fillRect(-6,-4,12,2)}
 else if(id=='cowboy'){c.fillStyle='#8a5a2b';c.beginPath();c.ellipse(0,0,13,3,0,0,7);c.fill();c.beginPath();c.arc(0,-1,6,Math.PI,0);c.fill()}
 else if(id=='wizard'){tri(c,-8,1,2,-18,8,1,'#5b3fd0');c.fillStyle='#5b3fd0';c.fillRect(-11,0,22,3);c.fillStyle='#ffd23f';c.fillRect(-1,-8,3,3)}
 else if(id=='halo'){c.strokeStyle='#ffd23f';c.lineWidth=2.5;c.beginPath();c.ellipse(0,-6,7,2.5,0,0,7);c.stroke()}
 else if(id=='beanie'){c.fillStyle='#3ba3ff';c.beginPath();c.arc(0,1,9,Math.PI,0);c.fill();c.fillStyle='#fff';c.fillRect(-9,-1,18,3);c.beginPath();c.arc(0,-9,3,0,7);c.fill()}
 else if(id=='bow'){tri(c,0,-3,-9,-8,-9,2,'#ff5fa8');tri(c,0,-3,9,-8,9,2,'#ff5fa8');c.fillStyle='#d62f80';c.beginPath();c.arc(0,-3,2.5,0,7);c.fill()}
 else if(id=='sprout'){c.fillStyle='#3fae3f';c.fillRect(-1,-7,2,8);c.beginPath();c.ellipse(-5,-8,5,2.5,-.5,0,7);c.ellipse(5,-9,5,2.5,.5,0,7);c.fill()}
 else if(id=='cone'){tri(c,-7,1,0,-14,7,1,'#ff7a1a');c.fillStyle='#fff';c.fillRect(-4,-6,8,2);c.fillStyle='#ff7a1a';c.fillRect(-9,0,18,2)}
 else if(id=='chef'){c.fillStyle='#fff';c.fillRect(-8,-5,16,6);[-5,0,5].forEach((q,i)=>{c.beginPath();c.arc(q,-7-(i==1?2:0),5,0,7);c.fill()})}
 else if(id=='pirate'){c.fillStyle='#222';tri(c,-11,1,0,-10,11,1,'#222');c.fillRect(-11,0,22,2);c.fillStyle='#fff';c.fillRect(-1,-5,3,3)}
 else if(id=='santa'){tri(c,-9,1,6,-14,9,1,'#d22');c.fillStyle='#fff';c.fillRect(-10,0,20,3);c.beginPath();c.arc(6,-14,3,0,7);c.fill()}
 else if(id=='propeller'){c.fillStyle='#e23';c.beginPath();c.arc(0,1,8,Math.PI,0);c.fill();c.fillStyle='#3ba3ff';c.fillRect(-1,-10,3,3);const bw=18*Math.cos(T*25);c.fillRect(-bw/2,-11,bw,2)}
 else if(id=='viking'){c.fillStyle='#9aa';c.beginPath();c.arc(0,1,10,Math.PI,0);c.fill();tri(c,-10,-2,-16,-10,-8,-5,'#fff');tri(c,10,-2,16,-10,8,-5,'#fff')}
 else if(id=='tiara'){tri(c,-7,0,-5,-6,-3,0,'#ffd23f');tri(c,-2,0,0,-9,2,0,'#ffd23f');tri(c,3,0,5,-6,7,0,'#ffd23f')}
 else if(id=='crown'){c.fillStyle='#ffd23f';c.beginPath();c.moveTo(-7,2);c.lineTo(-7,-6);c.lineTo(-3.5,-1);c.lineTo(0,-8);c.lineTo(3.5,-1);c.lineTo(7,-6);c.lineTo(7,2);c.closePath();c.fill()}
 c.restore()}
function drawChar(c,px,py,face,ph,air,vy,t){
 const sk=SK[S.sk]||SK[0],hh=sk.rb?(t*120)%360:sk.h,col=`hsl(${hh},${sk.s}%,${sk.l}%)`,dk=`hsl(${hh},${sk.s}%,${Math.max(sk.l-18,8)}%)`,ty=S.ch;
 c.save();c.translate(px+13,py);c.scale(face,1);
 if(L&&L.fly){c.fillStyle='rgba(255,255,255,.9)';const fl=key.j?Math.sin(t*30)*.9:.3;[-1,1].forEach(w=>{c.save();c.translate(-3,14);c.rotate(-1.2+fl*w*.5+(w>0?.4:0));c.beginPath();c.ellipse(-9,0,11,4,0,0,7);c.fill();c.restore()})}
 const lx=ty=='block'?[-6,6]:[-10,-5,4,9];
 c.strokeStyle=dk;c.lineWidth=5;c.lineCap='round';
 lx.forEach((l,i)=>{const a=ph+i*Math.PI,sw=air?(l>0?5:-5)*(vy<0?1:.6):Math.sin(a)*6,lift=air?4:Math.max(0,-Math.cos(a))*3;
  c.beginPath();c.moveTo(l,24);c.lineTo(l+sw,33-lift);c.stroke()});
 c.fillStyle=col;
 if(ty=='block'){c.beginPath();c.roundRect(-13,2,26,24,7);c.fill();c.fillStyle='#14182e';c.fillRect(5,9,6,6)}
 else{
  c.strokeStyle=ty=='bunny'?'#fff':col;c.lineWidth=3.5;
  if(ty=='dog'){c.beginPath();c.moveTo(-10,15);c.lineTo(-17,9+Math.sin(t*14)*3);c.stroke()}
  else if(ty=='cat'){c.beginPath();c.moveTo(-10,17);c.quadraticCurveTo(-20,14,-17,3);c.stroke()}
  else{c.fillStyle='#fff';c.beginPath();c.arc(-11,17,3.8,0,7);c.fill()}
  c.fillStyle=col;c.beginPath();c.roundRect(-11,12,21,13,5);c.fill();
  c.fillStyle=dk;
  if(ty=='dog'){c.beginPath();c.ellipse(-1,8,3.5,7,.2,0,7);c.fill();c.beginPath();c.ellipse(11,8,3.5,7,-.2,0,7);c.fill()}
  else if(ty=='cat'){tri(c,-2,4,-1,-6,6,1,col);tri(c,5,1,12,-6,13,4,col)}
  else{c.fillStyle=col;c.beginPath();c.ellipse(2,-6,3,9,-.15,0,7);c.fill();c.beginPath();c.ellipse(9,-6,3,9,.15,0,7);c.fill();c.fillStyle='#ffc0d8';c.beginPath();c.ellipse(2,-6,1.2,6,-.15,0,7);c.fill();c.beginPath();c.ellipse(9,-6,1.2,6,.15,0,7);c.fill()}
  c.fillStyle=col;c.beginPath();c.arc(5,9,8.5,0,7);c.fill();
  c.fillStyle=dk;if(ty=='dog'){c.beginPath();c.ellipse(11,11,4.5,3.5,0,0,7);c.fill()}
  c.fillStyle='#14182e';c.beginPath();c.arc(8,7.5,1.8,0,7);c.fill();c.beginPath();c.arc(ty=='dog'?13:12,ty=='dog'?10:10,1.4,0,7);c.fill();
  hat(c,S.hat)}
 if(ty=='block'){hat(c,S.hat)}
 c.restore()}
// ---------- game ----------
let paused=false,adm=0,L,P,cam=0,T=0,clock=0,deaths=0,lvl=1,state='menu',key={l:0,r:0,j:0},jb=0,acc=0,last=0,trail=[],walk=0,flash=0,page=0,gain=0;
const hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function spawn(){P={x:60,y:326,vx:0,vy:0,w:26,h:34,on:0,coy:0,face:1,ref:-1};cam=0;trail=[]}
function start(n){cust=0;paused=false;lvl=n;L=build(n);T=0;clock=0;deaths=0;flash=0;spawn();state='play';['menu','shop','won'].forEach(i=>$(i).classList.remove('on'));$('back').style.display='block';$('pad').classList.add('on')}
function toMenu(){if(testing){edResume();return}state='menu';key.l=key.r=key.j=0;$('back').style.display='none';$('pad').classList.remove('on');['shop','won'].forEach(i=>$(i).classList.remove('on'));renderMenu();$('menu').classList.add('on')}
function die(){if(P&&P.inv>0)return;if(pon('shield')&&P&&!P.shd&&P.y<H+100){P.shd=1;P.inv=.8;flash=.2;return}deaths++;flash=.35;spawn()}
function win0(){state='won';key.l=key.r=key.j=0;const k=Math.round(clock*10)/10,first=S.best[lvl]==null;gain=first?10+Math.floor(Math.min(lvl,1000)/5)+(deaths?0:15):3;gain=Math.round(gain*(pon('cn2')?2:pon('cn1')?1.5:1));S.coins+=gain;if(first||k<S.best[lvl])S.best[lvl]=k;if(lvl<TOTAL&&lvl<=S.un&&S.un<lvl+1)S.un=lvl+1;save();
 $('won').innerHTML=`<h1>Level ${lvl} cleared</h1><div>${k}s &middot; ${deaths} falls &middot; +${gain} coins</div><div class="row">${lvl<TOTAL?'<button class="p" id="nx">Next level</button>':''}<button id="mn">Menu</button></div>`;
 $('won').classList.add('on');$('mn').onclick=toMenu;if($('nx'))$('nx').onclick=()=>start(lvl+1);$('back').style.display='none';$('pad').classList.remove('on')}
function step(dt){
 T+=dt;clock+=dt;if(flash>0)flash-=dt;jb-=dt;if(P.inv>0)P.inv-=dt;
 L.mov.forEach(m=>{const p=m.x;m.x=m.x0+(m.rg??140)*(.5+.5*Math.sin(T*m.sp+m.ph));m.dx=m.x-p});
 L.saw.forEach(s=>{s.cy=(s.by??342)-(s.amp??70)*(.5+.5*Math.sin(T*s.sp+s.ph));s.rot+=dt*8});
 const dir=key.r-key.l;P.vx=dir*RUN*(pon('spd2')?1.25:pon('spd1')?1.12:1);if(dir)P.face=dir;
 if(P.ref>=0&&L.mov[P.ref])P.x+=L.mov[P.ref].dx;

 else if(t=='pad'){k='pad';o={x:x0,y:wy>G-40?G-12:y0,w:40,h:12}}
 else if(t=='kill'){k='kill';o={x:x0,y:y0,w:40,h:100}}
 else return;
 E[k].push(o);ed.sel={k,o};ed.dirty=1}
function edPt(e){const r=ec.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width+cam,(e.clientY-r.top)*H/r.height]}
function edDown(e){
 if(e.preventDefault)e.preventDefault();try{ec.setPointerCapture(e.pointerId)}catch(_){}
 const[wx,wy]=edPt(e);ed.clr=0;const h=edHandle(ed.sel);
 if(ed.tool=='sel'&&h&&Math.hypot(wx-h.x,wy-h.y)<22){hp();ed.drag={t:'h',ht:h.t}}
 else if(ed.tool=='sel'){const q=edHit(wx,wy);ed.sel=q;if(q){hp();const r=edRect(q.k,q.o);ed.drag={t:'o',dx:r.x-wx,dy:r.y-wy}}else ed.drag={t:'p',sx:e.clientX,c0:cam}}
 else if(ed.tool=='era'){const q=edHit(wx,wy);if(q&&q.k!='flag'){hp();E[q.k].splice(E[q.k].indexOf(q.o),1);ed.dirty=1;edSay('Erased.')}}
 else{hp();edPlace(ed.tool,wx,wy);edSay('Placed. Switch to Move to adjust it.')}
 edProps()}
function edMove(e){const d=ed&&ed.drag;if(!d)return;
 if(d.t=='p'){const r=ec.getBoundingClientRect();cam=edClamp(d.c0-(e.clientX-d.sx)*W/r.width);$('es').value=edMax()?cam/edMax()*100:0;return}
 const[wx,wy]=edPt(e),o=ed.sel.o;ed.dirty=1;
 if(d.t=='o')edSetPos(ed.sel,snap(wx+d.dx),snap(wy+d.dy));
 else if(d.ht=='size'){const tall=o.y+o.h>H;o.w=Math.max(10,snap(wx-o.x));if(!tall)o.h=Math.max(10,snap(wy-o.y))}
 else if(d.ht=='w')o.w=Math.max(10,snap(wx-o.x));
 else if(d.ht=='mrg')o.rg=Math.max(0,snap(wx-90-o.x0));
 else o.amp=Math.max(0,snap(o.by-wy))}
function edUp(){if(ed&&ed.drag){ed.drag=null;edProps()}}
const TB=[['sel','&#9995;','Move','Drag, resize, edit'],['era','&#128465;','Erase','Tap to delete'],['ground','&#129003;','Ground','Floor block'],['plat','&#9644;','Platform','Floating ledge'],['wall','&#129521;','Wall','Tall block'],['spk','&#128314;','Spikes','Hurts on touch'],['saw','&#9881;','Saw','Spinning blade'],['mov','&#8596;','Mover','Slides sideways'],['pad','&#128994;','Bounce pad','Launches you up'],['kill','&#9760;','Kill zone','Instant fail area'],['flag','&#127937;','Flag','Level finish']];
function edTools(){const c=TB.find(a=>a[0]==ed.tool)||TB[0];$('tcur').textContent='Tool: '+c[2];$('tbx').innerHTML=TB.map(a=>`<button data-t="${a[0]}" class="${a[0]==ed.tool?'p':''}"><span style="font-size:22px">${a[1]}</span><b>${a[2]}</b><small>${a[3]}</small></button>`).join('')}
function edProps(){const p=$('eprops');if(!p)return;
 if(!ed.sel){p.innerHTML='<span style="opacity:.8">Move tool: tap an object to edit it, drag to move, drag its yellow dot to resize. Drag empty space or use the slider to scroll.</span>';return}
 const s=ed.sel;
 p.innerHTML='<b>'+EN[s.k]+'</b>'+EF[s.k].map(f=>`<label>${f[1]} <input data-f="${f[0]}" type="number" step="${f[0]=='sp'?0.1:10}" value="${Math.round(s.o[f[0]]*100)/100}" style="width:68px;padding:4px"></label>`).join('')+(s.k=='flag'?'':'<button data-a="dup">Duplicate</button><button data-a="del">Delete</button>')}
function edField(key,val){const s=ed.sel;if(!s||!isFinite(val))return;hp();
 if(key=='w'||key=='h')val=Math.max(10,val);if(key=='amp'||key=='rg')val=Math.max(0,val);
 const o=s.o;o[key]=val;if(key=='x0')o.x=val;if(key=='by')o.cy=val;ed.dirty=1}
function edTest(){edNorm();cust=1;cname=ed.name;lvl=1;L=clone(E);T=0;clock=0;deaths=0;flash=0;paused=false;spawn();state='play';testing=1;key.l=key.r=key.j=0;$('edt').classList.remove('on');$('back').style.display='block';$('pad').classList.add('on')}
function edResume(){testing=0;state='edit';key.l=key.r=key.j=0;$('back').style.display='none';$('pad').classList.remove('on');L=E;edNorm();spawn();cam=edClamp(cam);$('edt').classList.add('on');edSay('Back in the editor.')}
function edLeave(){$('edt').classList.remove('on');ed=null;L=null;cust=0;toMenu()}
function edAct(a){
 if(a!='clear')ed.clr=0;
 if(a=='undo')edSwap(hs,fu,'Nothing to undo.');
 else if(a=='redo')edSwap(fu,hs,'Nothing to redo.');
 else if(a=='test')edTest();
 else if(a=='save'){edNorm();const f=FL();ed.name=esc($('en').value)||ed.name;
  if(ed.fid==null&&f.length>=30){edSay('File list is full (30). Delete one first.');return}
  if(ed.fid==null){f.push({name:ed.name,data:clone(E)});ed.fid=f.length-1}else{f[ed.fid].name=ed.name;f[ed.fid].data=clone(E)}
  save();ed.dirty=0;edSay('Saved to My files.')}
 else if(a=='clear'){if(!ed.clr){ed.clr=1;edSay('Tap Clear all again to erase everything.');return}ed.clr=0;hp();const h=E.hue;E=blank();E.hue=h;L=E;ed.sel=null;ed.dirty=1;cam=0;edSay('Cleared. You can undo this.')}
 else if(a=='fly'){hp();E.fly=E.fly?0:1;ed.dirty=1;edSay(E.fly?'Flying on: hold Jump to flap.':'Flying off.')}
 else if(a=='del'&&ed.sel&&ed.sel.k!='flag'){hp();const r=E[ed.sel.k];r.splice(r.indexOf(ed.sel.o),1);ed.sel=null;ed.dirty=1}
 else if(a=='dup'&&ed.sel&&ed.sel.k!='flag'){hp();const c=clone(ed.sel.o);if(c.x!=null)c.x+=40;if(c.cx!=null)c.cx+=40;if(c.x0!=null){c.x0+=40;c.x=c.x0}E[ed.sel.k].push(c);ed.sel={k:ed.sel.k,o:c};ed.dirty=1}
 else if(a=='leave'){if(!ed.dirty)return edLeave();$('eq').innerHTML='<div class="mdl"><b>Save before leaving?</b><button class="p" data-a="sl">Save &amp; leave</button><button data-a="ll">Leave without saving</button><button data-a="kc">Keep editing</button></div>'}
 else if(a=='sl'){edAct('save');if(ed&&!ed.dirty)edLeave()}
 else if(a=='ll')edLeave();
 else if(a=='kc')$('eq').innerHTML=''}
function openEditor(data,fid,nm){
 paused=false;state='edit';testing=0;cust=0;
 ed={fid,name:nm||(fid!=null?FL()[fid].name:'My level '+(FL().length+1)),tool:'sel',sel:null,dirty:0,clr:0,drag:null};
 E=data;edNorm();L=E;spawn();cam=0;hs=[];fu=[];
 ['menu','shop','won','adm','mkr'].forEach(i=>$(i).classList.remove('on'));$('back').style.display='none';$('pad').classList.remove('on');
 const t=$('edt');
 t.innerHTML=`<div class="eb"><div class="row"><button data-a="undo">&#8630; Undo</button><button data-a="redo">Redo &#8631;</button></div><input id="en" value="${esc(ed.name)}" maxlength="24"><button data-a="leave">Leave &#10005;</button></div><div class="row"><button class="p" data-a="tb">&#129520; Toolbox</button><span id="tcur"></span></div><div id="tbx"></div><canvas id="ec" width="${W}" height="${H}"></canvas><input id="es" type="range" min="0" max="100" value="0"><div id="est"></div><div id="eprops"></div><div class="row"><button class="p" data-a="test">&#9654; Test</button><button class="p" data-a="save">Save</button><button data-a="clear">Clear all</button><button data-a="fly">Flying</button></div><div id="eq"></div>`;
 ec=$('ec');ex=ec.getContext('2d');
 ec.addEventListener('pointerdown',edDown);ec.addEventListener('pointermove',edMove);['pointerup','pointercancel'].forEach(v=>ec.addEventListener(v,edUp));
 $('es').oninput=()=>{cam=edClamp(+$('es').value/100*edMax())};
 $('en').oninput=()=>{ed.name=esc($('en').value);ed.dirty=1};
 edTools();edProps();edSay('Pick a tool, then tap the level.');t.classList.add('on')}
$('edt').addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('button');if(!b||!ed)return;
 if(b.dataset.a=='tb'){$('tbx').classList.toggle('on');return}
 if(b.dataset.t){ed.tool=b.dataset.t;edTools();$('tbx').classList.remove('on');edSay('Tool picked. Tap the level to place it.')}
 else if(b.dataset.a){edAct(b.dataset.a);if(ed&&state=='edit')edProps()}});
$('edt').addEventListener('change',e=>{const f=e.target.dataset&&e.target.dataset.f;if(f&&ed)edField(f,parseFloat(e.target.value))});
function edDraw(){if(!ex||!ed)return;
 ex.drawImage(cv,0,0);ex.save();ex.translate(-Math.round(cam),0);
 ex.lineWidth=1;ex.strokeStyle='rgba(255,255,255,.08)';ex.beginPath();
 for(let gx=Math.floor(cam/50)*50;gx<=cam+W;gx+=50){ex.moveTo(gx+.5,0);ex.lineTo(gx+.5,H)}
 for(let gy=0;gy<=H;gy+=50){ex.moveTo(cam-50,gy+.5);ex.lineTo(cam+W+50,gy+.5)}
 ex.stroke();
 ex.strokeStyle='rgba(255,210,63,.75)';ex.setLineDash([4,4]);
 E.saw.forEach(s=>{if(s.amp>0){ex.beginPath();ex.moveTo(s.cx,s.by-s.amp);ex.lineTo(s.cx,s.by);ex.stroke()}});
 E.mov.forEach(m=>ex.strokeRect(m.x0+m.rg,m.y,90,16));ex.setLineDash([]);
 if(ed.sel){const r=edRect(ed.sel.k,ed.sel.o),h=edHandle(ed.sel);ex.strokeStyle='#ffd23f';ex.lineWidth=2;ex.setLineDash([6,4]);ex.strokeRect(r.x-3,r.y-3,r.w+6,r.h+6);ex.setLineDash([]);
  if(h){ex.fillStyle='#ffd23f';ex.beginPath();ex.arc(h.x,h.y,9,0,7);ex.fill()}}
 ex.restore();ex.fillStyle='#fff';ex.font='bold 14px system-ui';ex.textAlign='left';
 ex.fillText('Tool: '+(ET.find(a=>a[0]==ed.tool)||['','Move'])[1]+(E.fly?'   FLY':''),8,18)}
renderMenu();requestAnimationFrame(loop);
